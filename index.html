<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица блюд</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        img {
            width: 150px;
            height: 150px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Название блюда</th>
            <th>Оценка</th>
            <th>Рецепт</th>
            <th>Фото</th>
        </tr>
        <tr>
            <td>Яичница с беконом</td>
            <td>7</td>
            <td><a href="#">Ссылка</a></td>
            <td><img src="images/eggs_bacon.jpg" alt="Яичница с беконом"></td>
        </tr>
        <tr>
            <td>Борщ</td>
            <td>9</td>
            <td><a href="#">Ссылка</a></td>
            <td><img src="images/borscht.jpg" alt="Борщ"></td>
        </tr>
        <tr>
            <td>Стейк рибай</td>
            <td>8</td>
            <td><a href="#">Ссылка</a></td>
            <td><img src="images/ribeye_steak.jpg" alt="Стейк рибай"></td>
        </tr>
        <tr>
            <td>Овощной салат</td>
            <td>6</td>
            <td><a href="#">Ссылка</a></td>
            <td><img src="images/vegetable_salad.jpg" alt="Овощной салат"></td>
        </tr>
        <tr>
            <td>Салат из тунца</td>
            <td>8</td>
            <td><a href="#">Ссылка</a></td>
            <td><img src="images/tuna_salad.jpg" alt="Салат из тунца"></td>
        </tr>
    </table>
</body>
</html>
